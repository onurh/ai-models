      - {model: claude-fable-5, score: 80.0, source: vendor, date: "2026-08", harness: "vendor scaffold board"}
      - {model: claude-opus-5, score: 79.2, source: vendor, date: "2026-07"}
      - {model: grok-4-5, score: 64.7, source: vendor, date: "2026-07", note: "price-performance outlier"}
