# AI benchmark scores — September 2026
# Schema: SCHEMA.md §Score schema.
# `model` values are the normalized `id` keys from models.yaml where the model is tracked there;
# reference models not in the pricing matrix keep their kebab-case id here only.
# WARNING: scores from different harnesses are NOT directly comparable.
#   source: "independent" (third-party run) vs "vendor" (self-reported, own scaffold).
#   Always read `source` + `harness` before comparing two rows.

benchmarks:

  # ── Coding ──────────────────────────────────────────────
  - benchmark: SWE-bench Verified
    version: "2026-08"
    category: coding
    what: "Real GitHub issues from popular Python repos, human-verified subset"
    unit: "%"
    scores:
      - {model: claude-opus-5, score: 96.5, source: vendor, date: "2026-07", note: "Anthropic launch figure, Claude Code harness"}
      - {model: gpt-5-6-sol, score: 96.2, source: independent, date: "2026-07", harness: "vals.ai leaderboard"}
      - {model: claude-fable-5, score: 95.0, source: independent, date: "2026-06", harness: "vals.ai leaderboard"}
      - {model: kimi-k3, score: 93.4, source: independent, date: "2026-07", harness: "vals.ai leaderboard — highest open-weight score"}
      - {model: gpt-5-6-luna, score: 93.0, source: independent, date: "2026-07", harness: "vals.ai leaderboard"}
      - {model: claude-opus-4-8, score: 88.6, source: independent, date: "2026-05"}
      - {model: gpt-5-5, score: 88.7, source: vendor, date: "2026-05"}
