# Our task suite — v1
# Each task is one prompt + one grader. Graders:
#   exact    — output must equal `answer` (normalized: strip, lowercase)
#   contains — output must contain `answer` (case-insensitive)
#   regex    — output must match `answer` pattern
#   judge    — LLM-as-judge against `rubric` (run.py --judge-model <id>)
#   human    — manual grading; run.py saves the output, you fill results.yaml
# capability values map to SCHEMA tag names — a task exists to justify/refute a tag.

version: "1"

tasks:

  # ── coding (tag: coding) ────────────────────────────────
  - id: code-01
    capability: coding
    prompt: |
      In Python, write a function `merge_intervals(intervals)` that merges all
      overlapping intervals. Return the merged list sorted by start.
      Output ONLY the function code, no explanation.
    grader: judge
    rubric: |
      Correct algorithm; handles empty list, adjacent intervals, fully nested
      intervals; O(n log n); runs without syntax errors.

  - id: code-02
    capability: coding
    prompt: |
      This function has a bug. Find and fix it, output only the corrected function:
      def fib(n):
          a, b = 0, 1
          for _ in range(n):
              a, b = b, a
          return a
    grader: contains
    answer: "a, b = b, a + b"

  # ── reasoning (tag: reasoning) ──────────────────────────
  - id: reason-01
    capability: reasoning
    prompt: |
      A bat and a ball cost $1.10 in total. The bat costs $1.00 more than the ball.
      How much does the ball cost? Reply with just the number in dollars.
    grader: exact
    answer: "$0.05"

  - id: reason-02
    capability: reasoning
    prompt: |
      If it takes 5 machines 5 minutes to make 5 widgets, how many minutes would
      it take 100 machines to make 100 widgets? Reply with just the number.
    grader: exact
    answer: "5"

  - id: math-01
    capability: reasoning
    prompt: |
      What is the sum of all prime numbers below 20? Reply with just the number.
    grader: exact
    answer: "77"

  # ── instruction-following ───────────────────────────────
  - id: instr-01
    capability: instruction-following
    prompt: |
      Write a 4-sentence product description for a mechanical keyboard.
      Constraints: sentence 1 must start with the word "Typing"; do not use the
      letter "e" in sentence 4; end with the exact token "END".
    grader: judge
    rubric: |
      Exactly 4 sentences; sentence 1 starts with "Typing"; sentence 4 contains
      no letter "e"/"E"; output ends with "END"; reads as a coherent product description.

  # ── long-context (tag: long-context) ────────────────────
  - id: longctx-01
    capability: long-context
    prompt_file: prompts/longctx-01.txt   # generated by run.py --make-longctx
    grader: contains
    answer: "the anchor phrase is qz-7319-mango"
    notes: "run.py generates a ~120K-token filler document with the anchor phrase embedded; requires ≥128K context to pass fairly"

  # ── tool-use / agent (tag: agent) ───────────────────────
  - id: tool-01
    capability: agent
    prompt: |
      You have these tools: get_weather(city), get_time(city), convert(temp, unit).
      Answer the user's question by specifying the exact tool calls in order.
      User question: "Is it colder in Oslo or in Helsinki right now, and by how many degrees Celsius?"
    grader: judge
    rubric: |
      Calls get_weather for both Oslo and Helsinki; performs a Celsius conversion
      or requests Celsius units; states a comparative answer with a numeric difference.

  # ── Turkish (multilingual quality) ──────────────────────
  - id: tr-01
    capability: multilingual
    prompt: |
      Aşağıdaki cümleyi daha resmi bir üslupla yeniden yazın, anlamı değiştirmeden.
      Cümle: "Bu iş çok uzun sürdü, bir an önce bitsin istiyorum."
    grader: judge
    rubric: |
      Anlam korunmuş; üslup belirgin şekilde daha resmi; doğal ve gramerli Türkçe;
      tek cümle olarak verilmiş.
